{% extends "base.html" %}

{% block content %}
<div class="content">
    <h2 style="margin-bottom: 30px;">✏️ 編輯聯絡人</h2>

    <form method="POST" style="max-width: 600px;">
        <div class="form-group">
            <label for="name">* 名稱</label>
            <input type="text" id="name" name="name" required value="{{ contact.name }}">
        </div>

        <div class="form-group">
            <label for="phone">* 電話號碼</label>
            <input type="tel" id="phone" name="phone" required value="{{ contact.phone }}">
        </div>

        <div class="form-group">
            <label for="email">📧 電子郵件</label>
            <input type="email" id="email" name="email" value="{{ contact.email }}">
        </div>

        <div class="form-group">
            <label for="company">🏢 公司名稱</label>
            <input type="text" id="company" name="company" value="{{ contact.company }}">
        </div>

        <div class="form-group">
            <label for="category">🏷️ 分類</label>
            <select id="category" name="category">
                <option value="">-- 選擇分類 --</option>
                <option value="同事" {% if contact.category=='同事' %}selected{% endif %}>同事</option>
                <option value="客戶" {% if contact.category=='客戶' %}selected{% endif %}>客戶</option>
                <option value="家人" {% if contact.category=='家人' %}selected{% endif %}>家人</option>
                <option value="朋友" {% if contact.category=='朋友' %}selected{% endif %}>朋友</option>
            </select>
        </div>

        <div class="form-group">
            <label for="notes">📝 備註</label>
            <textarea id="notes" name="notes">{{ contact.notes }}</textarea>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-success">✅ 確認更新</button>
            <a href="{{ url_for('view', contact_id=contact.id) }}" class="btn btn-primary" style="text-align: center;">←
                返回詳細</a>
        </div>
    </form>
</div>
{% endblock %}
